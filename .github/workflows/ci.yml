name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - release/**

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  legacy-tests:
    name: Legacy tests (PHP 7.1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.1"
          extensions: curl, json, mbstring
          coverage: none

      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "directory=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.directory }}
          key: legacy-php71-${{ hashFiles('composer.json') }}
          restore-keys: legacy-php71-

      - name: Remove non-legacy development tools
        run: composer remove vimeo/psalm psalm/plugin-phpunit friendsofphp/php-cs-fixer overtrue/phplint phpbench/phpbench --dev --no-interaction --no-update

      - name: Pin PHPUnit for PHP 7.1
        run: composer require phpunit/phpunit:'^7.5.0' --dev --no-interaction --no-update

      - name: Install dependencies
        run: composer update --no-progress --no-interaction --prefer-dist --prefer-lowest

      - name: Run unit tests
        run: composer test

  quality:
    name: Quality checks (PHP 8.4)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: curl, json, mbstring
          coverage: none

      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "directory=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.directory }}
          key: quality-php84-${{ hashFiles('composer.json') }}
          restore-keys: quality-php84-

      - name: Pin PHPUnit for PHP 8.4
        run: composer require phpunit/phpunit:'^9.6.21' --dev --no-interaction --no-update

      - name: Install dependencies
        run: composer update --no-progress --no-interaction --prefer-dist

      - name: Lint
        run: composer lint

      - name: PHP CS Fixer
        run: composer php-cs-fixer fix -- --dry-run --diff

      - name: Psalm
        run: composer psalm

      - name: Unit tests
        run: composer test

      - name: Validate root manifest
        run: composer validate --strict --no-check-lock

      - name: Validate split manifests
        run: |
          composer validate --strict --no-check-lock packages/core/composer.json
          composer validate --strict --no-check-lock packages/symfony/composer.json
          composer validate --strict --no-check-lock packages/laravel/composer.json
          composer validate --strict --no-check-lock packages/yii2/composer.json
          composer validate --strict --no-check-lock packages/slim4/composer.json
          composer validate --strict --no-check-lock packages/wordpress/composer.json
          composer validate --strict --no-check-lock packages/drupal/composer.json
          composer validate --strict --no-check-lock packages/drupal7/composer.json

  package-smoke:
    name: Package smoke (${{ matrix.package.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - { name: core, path: packages/core, php: "7.1", class: "DuckBug\\Duck", extensions: "curl, json, mbstring" }
          - { name: symfony, path: packages/symfony, php: "7.1", class: "DuckBug\\Integrations\\Symfony\\DuckBugExceptionListener", extensions: "curl, json, mbstring" }
          - { name: laravel, path: packages/laravel, php: "7.1", class: "DuckBug\\Integrations\\Laravel\\DuckBugServiceProvider", extensions: "curl, json, mbstring" }
          - { name: yii2, path: packages/yii2, php: "7.1", class: "DuckBug\\Integrations\\Yii2\\DuckBugTarget", extensions: "curl, json, mbstring" }
          - { name: slim4, path: packages/slim4, php: "8.2", class: "DuckBug\\Integrations\\Slim4\\DuckBugMiddleware", extensions: "curl, json, mbstring" }
          - { name: wordpress, path: packages/wordpress, php: "7.1", class: "DuckBug\\Integrations\\WordPress\\WordPressBootstrap", extensions: "curl, json, mbstring" }
          - { name: drupal, path: packages/drupal, php: "8.3", class: "DuckBug\\Integrations\\Drupal\\DuckBugExceptionSubscriber", extensions: "curl, dom, gd, iconv, intl, json, mbstring, pdo_sqlite, simplexml, xml, xmlwriter" }
          - { name: drupal7, path: packages/drupal7, php: "7.1", class: "DuckBug\\Integrations\\Drupal7\\Drupal7Bootstrap", extensions: "curl, json, mbstring" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.package.php }}
          extensions: ${{ matrix.package.extensions }}
          coverage: none

      - name: Determine Composer cache directory
        id: composer-cache
        working-directory: ${{ matrix.package.path }}
        run: echo "directory=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.directory }}
          key: package-${{ matrix.package.name }}-${{ matrix.package.php }}-${{ hashFiles('packages/**/composer.json') }}
          restore-keys: package-${{ matrix.package.name }}-${{ matrix.package.php }}-

      - name: Validate package manifest
        run: composer validate --strict --no-check-lock composer.json
        working-directory: ${{ matrix.package.path }}

      - name: Install package dependencies
        run: composer update --no-progress --no-interaction --prefer-dist
        working-directory: ${{ matrix.package.path }}

      - name: Verify package autoload
        run: php -r "require 'vendor/autoload.php'; exit(class_exists('${{ matrix.package.class }}') ? 0 : 1);"
        working-directory: ${{ matrix.package.path }}
